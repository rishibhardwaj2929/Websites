<!DOCTYPE html>
<html>
<head>
<title>BookMyShow Clone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}




.header{
    background:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#e91e63;
}

.search{
    width:500px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.signin{
    background:#e91e63;
    color:white;z
    padding:10px 20px;
    border-radius:5px;
}






.navbar{
    background:white;
    padding:15px 40px;
}

.navbar a{
    text-decoration:none;
    color:black;
    margin-right:25px;
    font-size:18px;
}







.banner{
    width:90%;
    height:350px;
    margin:20px auto;
    background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200')
    center/cover;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.banner-text{
    background:rgba(0,0,0,0.6);
    color:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

.banner-text h1{
    margin-bottom:10px;
}

.btn{
    background:#e91e63;
    color:white;
    padding:10px 20px;
    display:inline-block;
    margin-top:10px;
    border-radius:5px;
}







.section{
    width:90%;
    margin:30px auto;
}

.section h2{
    margin-bottom:20px;
}

.movies{
    display:flex;
    justify-content:space-between;
}

.movie{
    width:23%;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 5px gray;
}

.movie img{
    width:100%;
    height:300px;
}

.movie h3{
    padding:10px;
}

.movie p{
    padding:0 10px 10px;
    color:gray;
}

.footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}
</style>

</head>
<body>

<div class="header">
    <div class="logo">bookmyshow</div>

    <input type="text" class="search"
    placeholder="Search Movies, Events, Sports">

    <div class="signin">Sign In</div>
</div>





<div class="navbar">
    <a href="#">Movies</a>
    <a href="#">Events</a>
    <a href="#">Plays</a>
    <a href="#">Sports</a>
    <a href="#">Activities</a>
</div>




<div class="banner">
    <div class="banner-text">
        <h1>Watch Latest Movies</h1>
        <p>Book tickets online now</p>
        <div class="btn">Book Now</div>
    </div>
</div>




<div class="section">
    <h2>Recommended Movies</h2>





    <div class="movies">

       <div class="movie">
            <img src="https://picsum.photos/300/300?1"> 
            <h3>Movie 1</h3>
            <p>Action / Drama</p>
        </div>

        <div class="movie">
            <img src="https://picsum.photos/300/300?2"> 
            <h3>Movie 2</h3>
            <p>Comedy</p>
        </div>

        <div class="movie">
            <img src="https://picsum.photos/300/300?3"> 
            <h3>Movie 3</h3>
            <p>Romance</p>
        </div>

        <div class="movie">
            <img src="https://picsum.photos/300/300?4">  
            <h3>Movie 4</h3>
            <p>Thriller</p>
        </div>
    </div>
</div>




<div class="footer">
    <h3>BookMyShow Clone</h3>
    <p>© 2026 All Rights Reserved</p>
</div>

</body>
</html>
<!DOCTYPE html>
