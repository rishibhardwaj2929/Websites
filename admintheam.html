<!DOCTYPE html>
<html>
<head>
<title>Dashboard Grid</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#1f242d;
    color:white;
}

.container{
    display:grid;
    grid-template-columns:250px 2fr;
    height:100vh;
}

.sidebar{
    background:#2b313a;
    padding:20px;
}

.logo{
    font-size:28px;
    text-align:center;
    margin-bottom:30px;
}

.menu div{
    padding:15px;
    margin-bottom:10px;
    background:#3a404a;
    border-radius:5px;
    cursor:pointer;
}

.content{
    padding:20px;
}

h1{
    margin-bottom:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:20px;
}

.card{
    padding:20px;
    border-radius:8px;
    min-height:120px;
}

.blue{
    background:#0d6efd;
}

.green{
    background:#198754;
}

.yellow{
    background:#ffc107;
    color:black;
}

.red{
    background:#dc3545;
}

.card h2{
    font-size:40px;
    margin-bottom:10px;
}

.dashboard{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.chart,
.map{
    border-radius:8px;
    padding:20px;
}

.chart{
    background:#252b34;
    height:400px;
}

.map{
    background:#0d6efd;
    height:400px;
}

.graph{
    height:300px;
    border-left:2px solid #777;
    border-bottom:2px solid #777;
    margin-top:20px;
    position:relative;
}

.line1{
    position:absolute;
    width:80%;
    height:3px;
    background:cyan;
    top:120px;
    left:20px;
    transform:rotate(-8deg);
}

.line2{
    position:absolute;
    width:80%;
    height:3px;
    background:dodgerblue;
    top:200px;
    left:20px;
    transform:rotate(10deg);
}

.world{
    display:flex;
    justify-content:center;
    align-items:center;
    height:300px;
    font-size:120px;
}
</style>

</head>
<body>

<div class="container">

    <div class="sidebar">
        <div class="logo">AdminLTE</div>

        <div class="menu">
            <div>Dashboard</div>
            <div>Dashboard v1</div>
            <div>Dashboard v2</div>
            <div>Theme Generate</div>
            <div>Widgets</div>
            <div>Layout Options</div>
            <div>UI Elements</div>
            <div>Mailbox</div>
            <div>Forms</div>
            <div>Tables</div>
        </div>
    </div>

    <div class="content">

        <h1>Dashboard</h1>

        <div class="cards">
            <div class="card blue">
                <h2>150</h2>
                <p>New Orders</p>
            </div>

            <div class="card green">
                <h2>53%</h2>
                <p>Bounce Rate</p>
            </div>

            <div class="card yellow">
                <h2>44</h2>
                <p>User Registrations</p>
            </div>

            <div class="card red">
                <h2>65</h2>
                <p>Unique Visitors</p>
            </div>
        </div>

        <div class="dashboard">

            <div class="chart">
                <h2>Sales Value</h2>

                <div class="graph">
                    <div class="line1"></div>
                    <div class="line2"></div>
                </div>
            </div>

            <div class="map">
                <h2>Sales Value</h2>

                <div class="world">
                    🌍
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
